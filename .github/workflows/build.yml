name: Build PHYSIX NumWorks app
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install official NumWorks ARM toolchain
        uses: numworks/setup-arm-toolchain@latest
      - name: Restore app icon
        run: base64 -d src/icon.png.base64 > src/icon.png
      - name: Build native .nwa
        run: make clean build
      - name: Upload .nwa
        uses: actions/upload-artifact@v4
        with:
          name: PHYSIX-NumWorks-nwa
          path: output/PHYSIX.nwa
          if-no-files-found: error
          retention-days: 30
